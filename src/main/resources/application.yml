server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/internance/config.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          search-paths: '{application}'
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_TOKEN}

encrypt:
  key: ${ENCRYPT_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env
  endpoint:
    health:
      show-details: when_authorized

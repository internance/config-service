server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/internance/config.git}
          default-label: ${CONFIG_GIT_LABEL:main}
          search-paths: '{application}'
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_TOKEN}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

config:
  monitor:
    topic: ${CONFIG_EVENTS_TOPIC:config-changed}
    webhook-secret: ${CONFIG_WEBHOOK_SECRET:}

encrypt:
  key: ${ENCRYPT_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

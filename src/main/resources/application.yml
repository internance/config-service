server:
  port: 8888

spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/internance/config.git
          default-label: main
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
name: Backend CI Pipeline

on:
  pull_request:
    branches: [ "dev", "main" ]

# Cancel superseded runs when a PR is pushed repeatedly.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: the workflow only reads the repo, never pushes.
permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          # No step needs the token after checkout; don't leave it in .git/config.
          persist-credentials: false

      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run tests and build
        run: ./gradlew build
